[project]
name = "agentpic"
version = "0.2.0"
description = "Python scientific adapters for the AgentPIC TypeScript engineering core"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gdsfactory==9.51.0",
  "sax==0.18.2",
  "jax>=0.6.2",
  "numpy>=2,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.16,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
    "datamodel-code-generator>=0.83.0",
]
# Electromagnetic characterization. FDTDX installs tidy3d as a dependency; AgentPIC code never
# imports tidy3d or uses FDTDX's tidy3d-backed mode sources, detectors or mode solver.
em = [
    "fdtdx==0.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
