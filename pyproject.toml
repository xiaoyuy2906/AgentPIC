[project]
name = "agentpic"
version = "0.1.0"
description = "Agent-native photonic circuit design, simulation, layout and verification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gdsfactory==9.51.0",
  "sax==0.18.2",
  "jax>=0.6.2",
  "numpy>=2,<3",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp==1.30.0",
]

[project.scripts]
agentpic = "agentpic.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "httpx>=0.27", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
