name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run pytest -q
      - run: uv run python scripts/acceptance.py --output runs/ci-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mzi-evidence-python-${{ matrix.python }}
          path: runs/ci-acceptance/
          if-no-files-found: ignore
