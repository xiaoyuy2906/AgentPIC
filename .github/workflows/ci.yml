name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  milestone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - run: npm run generate
      - run: git diff --exit-code -- schemas src/agentpic/ir.py
      - run: npm run typecheck
      - run: npm run format:check
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: npm test
      - run: npm run acceptance -- --output runs/ci-acceptance
      - run: npm run acceptance -- --specification examples/cascaded_mzi_1550.json --output runs/cascade-acceptance
      - run: npm run acceptance -- --specification examples/tunable_cascade_1550.json --output runs/phase-acceptance
      - run: npm run acceptance -- --specification examples/target_cascade_1550.json --output runs/target-acceptance
      - run: npm run benchmark:physics -- --output runs/physics-benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence-python-${{ matrix.python }}
          path: |
            runs/ci-acceptance/
            runs/cascade-acceptance/
            runs/phase-acceptance/
            runs/target-acceptance/
            runs/physics-benchmarks/
            /tmp/agentpic-*/
          if-no-files-found: ignore
